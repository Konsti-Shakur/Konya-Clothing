<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Konya Clothing V3.24 — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar mock-sidebar">
      <div class="mock-brand">
        <img src="assets/konya-logo.png" alt="Konya Clothing">
        <div><strong>KONYA</strong><span>CLOTHING</span></div>
      </div>
      <nav class="nav mock-nav">
        <div class="mock-nav-group"><div class="mock-nav-label">MAIN</div>
          <button class="nav-item active" data-view="dashboard"><span class="mock-ico">⌂</span><span>Übersicht</span></button>
          <button class="nav-item" data-view="orders"><span class="mock-ico">▣</span><span>Aufträge</span><span class="count-badge" id="ordersBadge">3</span></button>
          <button class="nav-item" data-view="customers"><span class="mock-ico">◉</span><span>Kunden</span></button>
          <button class="nav-item" data-view="clothing"><span class="mock-ico">◈</span><span>Designs</span></button>
          <button class="nav-item" data-view="tickets"><span class="mock-ico">□</span><span>Tickets</span><span class="count-badge danger" id="ticketsBadge">1</span></button>
        </div>
        <div class="mock-nav-group"><div class="mock-nav-label">VERWALTUNG</div>
          <button class="nav-item" data-view="categories"><span class="mock-ico">▦</span><span>Kategorien</span></button>
          <button class="nav-item" data-view="pricing"><span class="mock-ico">€</span><span>Preise & Leistungen</span></button>
          <button class="nav-item" data-view="employees"><span class="mock-ico">♙</span><span>Mitarbeiter</span></button>
          <button class="nav-item" data-view="showcase"><span class="mock-ico">◇</span><span>Showcase</span></button>
          <button class="nav-item" data-view="notifications"><span class="mock-ico">◉</span><span>Benachrichtigungen</span></button>
        </div>
        <div class="mock-nav-group"><div class="mock-nav-label">SYSTEM</div>
          <button class="nav-item" data-view="logs"><span class="mock-ico">⌁</span><span>Protokoll</span></button>
          <button class="sidebar-link" data-view="public"><span class="mock-ico">↗</span><span>Homepage</span></button>
          <button class="sidebar-link" data-view="customer"><span class="mock-ico">◎</span><span>Kundenbereich</span></button>
          <button class="sidebar-link" id="backupBtn"><span class="mock-ico">⛁</span><span>Datensicherung</span></button>
        </div>
      </nav>
      <div class="mock-user">
        <div class="avatar">KS</div>
        <div><strong>Konsti Shakur</strong><small>Inhaber / Admin</small><span class="mock-online"><i></i> Online</span></div>
        <span class="mock-chevron">⌄</span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar mock-topbar">
        <div class="mock-search"><span>⌕</span><input id="globalSearch" placeholder="Auftrag, Kunde oder Design suchen..." /><kbd>Strg + K</kbd></div>
        <div class="mock-top-actions">
          <button class="mock-bell" id="notifyBtn" title="Benachrichtigungen"><span>♢</span><span class="dot" id="notifyDot"></span></button>
          <button class="primary-btn mock-new-order" id="quickAdd">＋ Neuer Auftrag</button>
        </div>
      </header>

      <section id="viewRoot"></section>
    </main>
  </div>

  <div class="modal-backdrop hidden" id="modalBackdrop">
    <div class="modal">
      <button class="modal-close" id="modalClose">×</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
